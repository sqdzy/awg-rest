services:
  awg-rest:
    environment:
      # Explicit opt-in: this file is not loaded by the base deployment.
      BOOTSTRAP_V31_ENABLED: "true"
      BOOTSTRAP_V31_TENANT_SLUG: ${BOOTSTRAP_TENANT_SLUG:-default}
      BOOTSTRAP_V31_PROFILE_NAME: ${BOOTSTRAP_V31_PROFILE_NAME:-default-v3.1}
      BOOTSTRAP_V31_NODE_REGION: ${BOOTSTRAP_NODE_REGION:-default}
      BOOTSTRAP_V31_NODE_HOSTNAME: ${BOOTSTRAP_V31_NODE_HOSTNAME:-awg-node-31}
      BOOTSTRAP_V31_NODE_ENDPOINT: ${BOOTSTRAP_NODE_ENDPOINT:-127.0.0.1}
      BOOTSTRAP_V31_NODE_BASE_PORT: ${AWG_V31_UDP_PORT:-38824}
      BOOTSTRAP_V31_NODE_IFACE: ${BOOTSTRAP_V31_NODE_IFACE:-awg31}
      BOOTSTRAP_V31_POOL_CIDR: ${BOOTSTRAP_V31_POOL_CIDR:-10.201.0.0/24}
      BOOTSTRAP_V31_CONF_DIR: /var/lib/awg-rest/bootstrap
      BOOTSTRAP_V31_ENABLE_NAT: ${BOOTSTRAP_ENABLE_NAT:-true}
      BOOTSTRAP_V31_ACCEPT_NEW_PEERS: ${BOOTSTRAP_V31_ACCEPT_NEW_PEERS:-true}
      BOOTSTRAP_V31_EGRESS_IFACE: ${BOOTSTRAP_EGRESS_IFACE:-eth0}
    ports:
      - "${AWG_V31_UDP_BIND:-38824}:${AWG_V31_UDP_PORT:-38824}/udp"
