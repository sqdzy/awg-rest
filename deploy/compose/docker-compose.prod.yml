# Production-oriented compose skeleton.
#
# Network model:
# - No service publishes ports to the host by default.
# - awg-api listens on :18080 inside the container so other containers on the
#   same internal Docker network can reach http://awg-api:18080.
# - To let a backend container in another compose project call this API, attach
#   that backend to the named Docker network below as an external network.
# - If host-local access is required, publish only loopback:
#     ports: ["127.0.0.1:18080:18080"]
#
# Required local secret files are under ./secrets by default. Do not commit them.

services:
  postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: awg
      POSTGRES_USER: awg
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    volumes:
      - awg-postgres:/var/lib/postgresql/data
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U awg -d awg"]
      interval: 10s
      timeout: 3s
      retries: 30
    networks:
      - awg-internal
    secrets:
      - postgres_password

  awg-api:
    image: ${AWG_API_IMAGE:?set AWG_API_IMAGE}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL_FILE: /run/secrets/database_url
      HTTP_ADDR: ":18080"
      JWT_PUBLIC_KEY_FILE: /run/secrets/jwt_public_key
      JWT_ISSUER: ${JWT_ISSUER:?set JWT_ISSUER}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-awg-control-plane}
      JWT_ALLOWED_ALGS: ${JWT_ALLOWED_ALGS:-RS256,ES256,EdDSA}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      LOG_JSON: "true"
      BOOTSTRAP_ENABLED: "false"
    expose:
      - "18080"
    read_only: true
    cap_drop: ["ALL"]
    security_opt:
      - no-new-privileges:true
    networks:
      - awg-internal
    secrets:
      - database_url
      - jwt_public_key

  awg-worker:
    image: ${AWG_WORKER_IMAGE:?set AWG_WORKER_IMAGE}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      awg-node-agent:
        condition: service_started
    environment:
      DATABASE_URL_FILE: /run/secrets/database_url
      NODE_AGENT_URL: https://awg-node-agent:8081
      WORKER_TLS_CERT: /run/secrets/worker_tls_cert
      WORKER_TLS_KEY: /run/secrets/worker_tls_key
      WORKER_CA_BUNDLE: /run/secrets/agent_ca
      LOG_LEVEL: ${LOG_LEVEL:-info}
      LOG_JSON: "true"
    read_only: true
    cap_drop: ["ALL"]
    security_opt:
      - no-new-privileges:true
    networks:
      - awg-internal
      - awg-agent
    secrets:
      - database_url
      - worker_tls_cert
      - worker_tls_key
      - agent_ca

  awg-node-agent:
    image: ${AWG_NODE_AGENT_IMAGE:?set AWG_NODE_AGENT_IMAGE}
    restart: unless-stopped
    environment:
      AGENT_ADDR: ":8081"
      AGENT_TLS_CERT: /run/secrets/agent_tls_cert
      AGENT_TLS_KEY: /run/secrets/agent_tls_key
      AGENT_CLIENT_CA_BUNDLE: /run/secrets/agent_client_ca
      LOG_LEVEL: ${LOG_LEVEL:-info}
      LOG_JSON: "true"
      WG_QUICK_USERSPACE_IMPLEMENTATION: amneziawg-go
    expose:
      - "8081"
    ports:
      - "${AWG_UDP_PORT:-51820}:${AWG_UDP_PORT:-51820}/udp"
    cap_add: ["NET_ADMIN"]
    devices:
      - /dev/net/tun:/dev/net/tun
    security_opt:
      - no-new-privileges:true
    volumes:
      - awg-rendered:/etc/amnezia/rendered
      - ./bootstrap:/etc/amnezia/bootstrap:ro
    networks:
      - awg-agent
    secrets:
      - agent_tls_cert
      - agent_tls_key
      - agent_client_ca

networks:
  awg-internal:
    name: ${AWG_INTERNAL_NETWORK:-awg-backend-internal}
    internal: true
  awg-agent:
    internal: true

volumes:
  awg-postgres:
  awg-rendered:

secrets:
  postgres_password:
    file: ./secrets/postgres_password
  database_url:
    file: ./secrets/database_url
  jwt_public_key:
    file: ./secrets/jwt_public_key.pem
  worker_tls_cert:
    file: ./secrets/worker.crt
  worker_tls_key:
    file: ./secrets/worker.key
  agent_ca:
    file: ./secrets/agent_ca.pem
  agent_tls_cert:
    file: ./secrets/agent.crt
  agent_tls_key:
    file: ./secrets/agent.key
  agent_client_ca:
    file: ./secrets/agent_client_ca.pem
