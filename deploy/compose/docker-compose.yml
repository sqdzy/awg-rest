# docker-compose stack for local development. NOT a production deployment:
# JWT_SECRET is hard-coded, mTLS is disabled, and published ports are bound to
# host loopback only. On Linux the node-agent uses the real awg CLI.

services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: awg
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d awg"]
      interval: 3s
      timeout: 3s
      retries: 30
    ports:
      - "127.0.0.1:5432:5432"

  awg-api:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
      target: awg-api
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/awg?sslmode=disable
      HTTP_ADDR: ":18080"
      JWT_SECRET: dev-secret-please-change-in-production
      JWT_ISSUER: awg-rest
      JWT_AUDIENCE: awg-control-plane
      JWT_ALLOWED_ALGS: HS256
      LOG_LEVEL: info
    ports:
      - "127.0.0.1:18080:18080"

  awg-worker:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
      target: awg-worker
    depends_on:
      postgres:
        condition: service_healthy
      awg-node-agent:
        condition: service_started
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/awg?sslmode=disable
      JWT_SECRET: dev-secret-please-change-in-production
      LOG_LEVEL: info
      NODE_AGENT_URL: http://awg-node-agent:8081
      NODE_AGENT_INSECURE_HTTP: "true"

  awg-node-agent:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
      target: awg-node-agent
    cap_add: ["NET_ADMIN"]
    environment:
      AGENT_ADDR: ":8081"
      AGENT_INSECURE_HTTP: "true"
      LOG_LEVEL: info
    ports:
      - "127.0.0.1:8081:8081"
