name: real-awg-e2e

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  GO_VERSION: "1.25.9"

jobs:
  e2e-real-awg:
    name: e2e (real AmneziaWG)
    runs-on: [self-hosted, linux, real-awg]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: e2e (real-awg)
        run: sudo -E env "PATH=$PATH" go test -timeout=600s -tags="e2e linux_awg" ./test/e2e/...
