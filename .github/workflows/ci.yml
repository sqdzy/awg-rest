name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  GO_VERSION: "1.26.x"
  TESTCONTAINERS_RYUK_DISABLED: "true"

permissions:
  contents: read

jobs:
  lint-unit:
    name: lint + unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: actionlint
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
      - name: gofmt
        shell: bash
        run: |
          set -euo pipefail
          unformatted="$(gofmt -l .)"
          if [[ -n "$unformatted" ]]; then
            printf 'Unformatted Go files:\n%s\n' "$unformatted"
            exit 1
          fi
      - name: vet
        run: go vet ./...
      - name: build
        run: go build ./...
      - name: unit tests
        run: go test -timeout=120s -count=1 ./...
      - name: compile real-AWG tagged tests
        run: go test -run '^$' -count=1 -tags="e2e linux_awg" ./test/e2e/...
      - name: govulncheck
        uses: golang/govulncheck-action@v1
        with:
          repo-checkout: false
          go-version-input: ${{ env.GO_VERSION }}
          go-package: ./...

  integration:
    name: integration (Postgres via testcontainers)
    runs-on: ubuntu-latest
    needs: [lint-unit]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: integration tests
        run: go test -timeout=300s -tags=integration ./test/integration/...

  e2e:
    name: e2e (fake AWG)
    runs-on: ubuntu-latest
    needs: [lint-unit]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: e2e tests
        run: go test -timeout=300s -tags=e2e ./test/e2e/...

  docker-build:
    # Preserve the required status-check context from the protected main branch.
    # This job also executes the real userspace AWG network E2E.
    name: docker images
    runs-on: ubuntu-24.04
    needs: [lint-unit]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - uses: docker/setup-buildx-action@v4
      - name: validate compose + v3.1 override
        run: docker compose -f compose.yaml -f compose.v31.yaml config >/dev/null
      - name: build all-in-one
        run: docker build -f deploy/docker/Dockerfile.all-in-one --target awg-rest-all-in-one -t awg-rest-all-in-one:ci .
      - name: extract pinned AWG runtime
        shell: bash
        run: |
          set -euo pipefail
          out="${RUNNER_TEMP}/awg31-bin"
          mkdir -p "$out"
          cid="$(docker create awg-rest-all-in-one:ci)"
          trap 'docker rm -f "$cid" >/dev/null 2>&1 || true' EXIT
          docker cp "$cid:/usr/local/bin/awg" "$out/awg"
          docker cp "$cid:/usr/local/bin/awg-quick" "$out/awg-quick"
          docker cp "$cid:/usr/local/bin/amneziawg-go" "$out/amneziawg-go"
          chmod 0755 "$out/awg" "$out/awg-quick" "$out/amneziawg-go"
          echo "$out" >> "$GITHUB_PATH"
      - name: prepare TUN
        shell: bash
        run: |
          set -euo pipefail
          command -v ip
          command -v ping
          sudo modprobe tun 2>/dev/null || true
          if [[ ! -c /dev/net/tun ]]; then
            sudo mkdir -p /dev/net
            sudo mknod /dev/net/tun c 10 200
          fi
          sudo chmod 0666 /dev/net/tun
          test -c /dev/net/tun
      - name: compile real userspace AWG test binary
        run: go test -c -tags="e2e linux_awg" -o "${RUNNER_TEMP}/real-awg-e2e.test" ./test/e2e
      - name: real userspace AWG network E2E
        shell: bash
        run: |
          set -euo pipefail
          awg --version
          amneziawg-go --version
          sudo -E env "PATH=$PATH" "${RUNNER_TEMP}/real-awg-e2e.test" \
            -test.v \
            -test.timeout=600s \
            -test.run="^TestRealAWG_ProtocolCompatibility$"
