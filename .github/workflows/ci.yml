name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  GO_VERSION: "1.26.4"
  TESTCONTAINERS_RYUK_DISABLED: "true"

permissions:
  contents: read

jobs:
  lint-unit:
    name: lint + unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: actionlint
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
      - name: vet
        run: go vet ./...
      - name: build
        run: go build ./...
      - name: unit tests
        run: go test -timeout=120s -count=1 ./...
      - name: govulncheck
        uses: golang/govulncheck-action@v1
        with:
          repo-checkout: false
          go-version-input: ${{ env.GO_VERSION }}
          go-package: ./...

  integration:
    name: integration (Postgres via testcontainers)
    runs-on: ubuntu-latest
    needs: [lint-unit]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: integration tests
        run: go test -timeout=300s -tags=integration ./test/integration/...

  e2e:
    name: e2e (fake AWG)
    runs-on: ubuntu-latest
    needs: [lint-unit]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: e2e tests
        run: go test -timeout=300s -tags=e2e ./test/e2e/...

  docker-build:
    name: docker image
    runs-on: ubuntu-latest
    needs: [lint-unit]
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: build all-in-one
        run: docker build -f deploy/docker/Dockerfile.all-in-one --target awg-rest-all-in-one -t awg-rest-all-in-one:ci .
