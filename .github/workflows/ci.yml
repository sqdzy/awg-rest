name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  GO_VERSION: "1.26.x"
  TESTCONTAINERS_RYUK_DISABLED: "true"

permissions:
  contents: read

jobs:
  lint-unit:
    name: lint + unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: actionlint
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
      - name: vet
        run: go vet ./...
      - name: build
        run: go build ./...
      - name: unit tests
        run: go test -timeout=120s -count=1 ./...
      - name: compile real-AWG tagged tests
        run: go test -run '^$' -count=1 -tags="e2e linux_awg" ./test/e2e/...
      - name: govulncheck
        uses: golang/govulncheck-action@v1
        with:
          repo-checkout: false
          go-version-input: ${{ env.GO_VERSION }}
          go-package: ./...

  integration:
    name: integration (Postgres via testcontainers)
    runs-on: ubuntu-latest
    needs: [lint-unit]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: integration tests
        run: go test -timeout=300s -tags=integration ./test/integration/...

  e2e:
    name: e2e (fake AWG)
    runs-on: ubuntu-latest
    needs: [lint-unit]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: e2e tests
        run: go test -timeout=300s -tags=e2e ./test/e2e/...

  docker-build:
    name: docker image + real userspace AWG
    runs-on: ubuntu-24.04
    needs: [lint-unit]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - uses: docker/setup-buildx-action@v4
      - name: build all-in-one
        run: docker build -f deploy/docker/Dockerfile.all-in-one --target awg-rest-all-in-one -t awg-rest-all-in-one:ci .
      - name: extract pinned AWG runtime
        shell: bash
        run: |
          set -euo pipefail
          out="${RUNNER_TEMP}/awg31-bin"
          mkdir -p "$out"
          cid="$(docker create awg-rest-all-in-one:ci)"
          trap 'docker rm -f "$cid" >/dev/null 2>&1 || true' EXIT
          docker cp "$cid:/usr/local/bin/awg" "$out/awg"
          docker cp "$cid:/usr/local/bin/amneziawg-go" "$out/amneziawg-go"
          chmod 0755 "$out/awg" "$out/amneziawg-go"
          echo "$out" >> "$GITHUB_PATH"
      - name: prepare TUN
        shell: bash
        run: |
          set -euo pipefail
          command -v ip
          command -v ping
          if [[ ! -c /dev/net/tun ]]; then
            sudo mkdir -p /dev/net
            sudo mknod /dev/net/tun c 10 200
          fi
          sudo chmod 0666 /dev/net/tun
          test -c /dev/net/tun
      - name: compile real userspace AWG test binary
        run: go test -c -tags="e2e linux_awg" -o "${RUNNER_TEMP}/real-awg-e2e.test" ./test/e2e
      - name: real userspace AWG network E2E
        shell: bash
        run: |
          set -euo pipefail
          awg --version
          amneziawg-go --version
          sudo -E env "PATH=$PATH" "${RUNNER_TEMP}/real-awg-e2e.test" \
            -test.v \
            -test.timeout=600s \
            -test.run="^TestRealAWG_ProtocolCompatibility$"
      - name: validate V3.1 Compose override
        run: docker compose -f compose.yaml -f compose.awg31.yaml config -q
      - name: all-in-one parallel V3.1 rollout smoke
        shell: bash
        env:
          AWG_REST_IMAGE: awg-rest-all-in-one:ci
          BOOTSTRAP_NODE_ENDPOINT: 127.0.0.1
          AWG_API_BIND: 127.0.0.1:18081
          AWG_UDP_BIND: 39923
          AWG_UDP_PORT: 38823
          AWG_V31_UDP_BIND: 39924
          AWG_V31_UDP_PORT: 38824
        run: |
          set -euo pipefail
          compose=(docker compose -p awg31-ci -f compose.yaml -f compose.awg31.yaml)
          cleanup() {
            "${compose[@]}" down -v --remove-orphans >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          cleanup

          "${compose[@]}" up -d

          ready=0
          for _ in {1..45}; do
            if curl -fsS http://127.0.0.1:18081/health/ready >/dev/null; then
              ready=1
              break
            fi
            sleep 1
          done
          if [[ "$ready" != "1" ]]; then
            "${compose[@]}" logs --no-color awg-rest
            exit 1
          fi

          interfaces="$("${compose[@]}" exec -T awg-rest awg show interfaces)"
          grep -qw awg0 <<<"$interfaces"
          grep -qw awg31 <<<"$interfaces"

          token="$("${compose[@]}" exec -T awg-rest /awg-api -dev-token)"
          create_body="$(
            curl -fsS -X POST "http://127.0.0.1:18081/v1/tenants/default/peers" \
              -H "Authorization: Bearer $token" \
              -H "Content-Type: application/json" \
              -H "Idempotency-Key: ci-v31-rollout-create" \
              -d '{"external_id":"ci-v31-rollout","node_hostname":"awg-node-31","profile_name":"default-v3.1"}'
          )"

          operation_id="$(
            CREATE_BODY="$create_body" python3 - <<'PY'
          import json, os
          body = json.loads(os.environ["CREATE_BODY"])
          assert body["client_config"], "missing one-time client config"
          assert "HeaderProtectionKey = " in body["client_config"], "not a V3.1 client config"
          assert body["node_id"], "missing node_id"
          print(body["operation_id"])
          PY
          )"

          applied=0
          for _ in {1..30}; do
            op_body="$(
              curl -fsS "http://127.0.0.1:18081/v1/operations/$operation_id" \
                -H "Authorization: Bearer $token"
            )"
            status="$(
              OP_BODY="$op_body" python3 - <<'PY'
          import json, os
          print(json.loads(os.environ["OP_BODY"])["status"])
          PY
            )"
            if [[ "$status" == "applied" ]]; then
              applied=1
              break
            fi
            if [[ "$status" == "failed_terminal" ]]; then
              printf '%s\n' "$op_body"
              exit 1
            fi
            sleep 1
          done
          if [[ "$applied" != "1" ]]; then
            "${compose[@]}" logs --no-color awg-rest
            exit 1
          fi

          peers="$("${compose[@]}" exec -T awg-rest awg show awg31 peers)"
          [[ -n "$peers" ]]
