name: release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-*"
  workflow_dispatch:
    inputs:
      version:
        description: "Semver version, with or without v prefix, for example 0.1.0"
        required: true
        type: string
      push:
        description: "Push images to GHCR"
        required: true
        default: true
        type: boolean

permissions:
  contents: read
  packages: write
  attestations: write
  id-token: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io

jobs:
  publish:
    name: publish ${{ matrix.image.target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image:
          - name: awg-rest-api
            target: awg-api
            title: awg-rest API
            description: Backend-only REST API for AmneziaWG V2 peer provisioning.
            licenses: MIT
          - name: awg-rest-worker
            target: awg-worker
            title: awg-rest worker
            description: Durable outbox worker and reconciler for awg-rest.
            licenses: MIT
          - name: awg-rest-node-agent
            target: awg-node-agent
            title: awg-rest node agent
            description: Node-local AmneziaWG apply agent with bundled amneziawg-tools.
            licenses: MIT AND GPL-2.0-only
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Resolve release version
        id: vars
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            version="${{ inputs.version }}"
            push_images="${{ inputs.push }}"
          else
            version="${GITHUB_REF_NAME}"
            push_images="true"
          fi

          version="${version#v}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid semver version: $version" >&2
            exit 1
          fi

          stable="true"
          if [[ "$version" == *-* ]]; then
            stable="false"
          fi

          {
            echo "version=$version"
            echo "push=$push_images"
            echo "stable=$stable"
          } >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        if: steps.vars.outputs.push == 'true'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.image.name }}
          tags: |
            type=raw,value=v${{ steps.vars.outputs.version }}
            type=raw,value=${{ steps.vars.outputs.version }}
            type=sha,prefix=sha-
            type=raw,value=latest,enable=${{ steps.vars.outputs.stable == 'true' }}
          labels: |
            org.opencontainers.image.title=${{ matrix.image.title }}
            org.opencontainers.image.description=${{ matrix.image.description }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.documentation=https://github.com/${{ github.repository }}#readme
            org.opencontainers.image.licenses=${{ matrix.image.licenses }}

      - name: Build and publish image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/Dockerfile
          target: ${{ matrix.image.target }}
          platforms: linux/amd64,linux/arm64
          push: ${{ steps.vars.outputs.push == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.vars.outputs.version }}
          cache-from: type=gha,scope=${{ matrix.image.target }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image.target }}
          sbom: true
          provenance: mode=max
