name: temporary-awg31-gofmt

on:
  push:
    branches:
      - feat/awg31-migration
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  gofmt:
    if: github.event_name == 'push' || github.head_ref == 'feat/awg31-migration'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/awg31-migration
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26.4"
      - name: Format Go sources
        shell: bash
        run: |
          set -euo pipefail
          mapfile -d '' files < <(find . -type f -name '*.go' -not -path './.git/*' -print0)
          gofmt -w "${files[@]}"
          if git diff --quiet -- '*.go'; then
            echo "No formatting changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- '*.go'
          git commit -m "style: gofmt AWG 3.1 migration"
          git push origin HEAD:feat/awg31-migration
